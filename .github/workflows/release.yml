name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/PhpSubnetScout.exe dist/PhpSubnetScout-*-win-x86.zip dist/SHA256SUMS.txt
          --verify-tag
          --title "PHP Subnet Scout $GITHUB_REF_NAME"
          --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
