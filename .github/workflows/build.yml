name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up verified FASM 1.73.35
        run: ./scripts/setup-fasm.ps1
      - name: Build native Windows executable
        run: ./build.ps1
      - name: Prepare isolated runner HTTP ports
        run: |
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object LocalPort -in 80,443,8080,4430 |
            Format-Table LocalAddress,LocalPort,OwningProcess
          foreach ($name in @('W3SVC','WAS','HTTP')) {
            $service = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq 'Running') {
              Stop-Service -Name $name -Force -ErrorAction Stop
            }
          }
      - name: Run loopback integration tests
        run: ./tests/smoke.ps1
      - name: Package portable release
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v','')
          } else {
            ./scripts/package.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/PhpSubnetScout.exe
            dist/PhpSubnetScout-*-win-x86.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
